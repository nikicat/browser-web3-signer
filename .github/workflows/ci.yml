name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call: # the Release workflow gates publishing on it

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: fmt + taplo + clippy + build + test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf rustup taplo-cli
          # rust-toolchain.toml drives channel + components on first cargo call.

      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: taplo fmt
        run: taplo fmt --check

      - name: taplo lint
        run: taplo lint

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: build
        run: cargo build --all-targets --locked

      - name: test
        run: cargo test --all-features --locked

  e2e:
    name: e2e (Playwright mock-wallet → Rust bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Build e2e harnesses
        run: cargo build --bin evm-harness --bin tron-harness --bin btc-harness --features e2e --locked

      - name: Install Node deps + Chromium
        working-directory: tests/e2e-browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Type-check e2e TypeScript
        working-directory: tests/e2e-browser
        run: npm run typecheck

      - name: Run Playwright e2e
        working-directory: tests/e2e-browser
        run: npm test

  e2e-leather:
    name: e2e-leather (CLI → real Leather extension → regtest)
    runs-on: ubuntu-latest
    env:
      BITCOIN_VERSION: "31.1"
      BITCOIN_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/leather
          key: ${{ runner.os }}-e2e-leather-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-leather-

      - name: Install Bitcoin Core (pinned, checksum-verified)
        run: |
          tarball="bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -sSfLO "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/${tarball}"
          echo "${BITCOIN_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          echo "$PWD/bitcoin-${BITCOIN_VERSION}/bin" >> "$GITHUB_PATH"

      # The Leather build is slow and depends only on the pinned tag in build-leather.sh.
      - name: Cache Leather build
        id: leather-cache
        uses: actions/cache@v6
        with:
          path: target/leather/apps/extension/dist
          key: leather-dist-${{ hashFiles('scripts/build-leather.sh') }}

      - uses: actions/setup-node@v7
        if: steps.leather-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - name: Build Leather (test mode)
        if: steps.leather-cache.outputs.cache-hit != 'true'
        run: |
          corepack enable
          scripts/build-leather.sh

      - name: Build the signer
        run: cargo build --bin browser-web3-signer --locked

      - name: Install Node deps + Chromium
        working-directory: tests/e2e-browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run real-wallet Bitcoin e2e
        working-directory: tests/e2e-browser
        env:
          LEATHER_EXT_DIR: ${{ github.workspace }}/target/leather/apps/extension/dist
        run: npx playwright test btc-leather

  ts-binding:
    name: ts-binding (${{ matrix.runner }}, node + deno)
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest # linux x64
          - macos-15-intel # darwin x64
          - macos-15 # darwin arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.arch disambiguates the two macOS runners (both runner.os == macOS).
          key: ${{ runner.os }}-${{ runner.arch }}-ts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ts-

      - name: Build the signer binary
        run: cargo build --bin browser-web3-signer --locked

      - name: Install Node deps
        working-directory: ts
        run: npm install

      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Test under Node (against the real serve subprocess)
        working-directory: ts
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Restricted-env on purpose: catches any regression to spawning the subprocess with the
      # permission-filtered environment (see test/deno_smoke_test.ts).
      - name: Test under Deno (Deno.Command spawn path)
        working-directory: ts
        run: npm run test:deno

  go-binding:
    name: go-binding (Go client over the serve subprocess)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-go-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build the signer binary
        run: cargo build --bin browser-web3-signer --locked

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test (against the real serve subprocess)
        working-directory: go
        run: go test ./...

  coverage:
    name: coverage (cargo-llvm-cov → Codecov)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf rustup cargo-llvm-cov

      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-

      - name: Generate lcov coverage
        run: |
          cargo llvm-cov --all-features --locked --lcov --output-path lcov.info \
            --ignore-filename-regex '(crates/browser-web3-signer/src/(main|output|flow)\.rs)'

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          # Set a CODECOV_TOKEN repo secret for protected-branch uploads.
          token: ${{ secrets.CODECOV_TOKEN }}
